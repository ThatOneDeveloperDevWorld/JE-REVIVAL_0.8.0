<script type="text/javascript">
(function () {
    function isMobile() {
        return /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    function createCanvas(id) {
        var splash = document.createElement('div')
        splash.id = 'splash';
        splash.innerHTML = '<div class="progress-bar stripes"><span style="width: 0%"></span></div>';

        var canvas = document.createElement('canvas');
        canvas.id = "GameCanvas";
        canvas.tabIndex = 0;
        if (isMobile() ) {
            canvas.oncontextmenu = "event.preventDefault()";
            canvas.appendChild(splash);
            document.body.appendChild(canvas);
            return;
        }
        canvas.width  = 750;
        canvas.height = 1334;
        canvas.appendChild(splash);
        
        
        var div = document.createElement("div");
        div.id = "GameDiv";
        var scalex = 750 / window.innerWidth;
        var scaley = 1334 / window.innerHeight;
        var scale = scalex > scaley ? scalex : scaley;

        console.log(`width: ${window.innerWidth} height:${window.innerHeight}`);
        console.log(`scalex: ${scalex} scaley:${scaley}`);
        console.log(`scale: ${scale}`);
        
        div.style = `width:${750 / scale}px; height: ${1334/scale}px;`
        div.appendChild(canvas);
        document.body.appendChild(div);
    }

    function resizeCanvas() {
        if (isMobile()) {
            return;
        }

        var div = document.getElementById("GameDiv");
        var scalex = 750 / window.innerWidth;
        var scaley = 1334 / window.innerHeight;
        var scale = scalex > scaley ? scalex : scaley;

        console.log(`width: ${window.innerWidth} height:${window.innerHeight}`);
        console.log(`scalex: ${scalex} scaley:${scaley}`);
        console.log(`scale: ${scale}`);
        
        div.style = `width:${750 / scale}px; height: ${1334/scale}px;`
    }

    createCanvas();
    window.onresize = resizeCanvas;
    

    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.43b1a.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>
